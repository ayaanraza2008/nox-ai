<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NOX Core Browser Smoke Test</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #f2f4ff; background: #05060b; font: 14px system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; grid-template-rows: auto minmax(320px, 1fr); padding: 20px; gap: 12px; }
      nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { padding: 8px 12px; color: #f2f4ff; border: 1px solid #39405c; border-radius: 8px; background: #11152a; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #6de7ff; background: #202044; }
      #core { min-height: 320px; display: grid; place-items: center; overflow: hidden; border: 1px solid #262843; border-radius: 20px; background: radial-gradient(ellipse at center, #171334, #05060b 70%); }
      #core > div { width: min(94vw, 620px); height: min(75vh, 620px); min-height: 320px; }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Core state test controls">
        <strong>NOX Core State Harness</strong>
        <button data-mode="IDLE" aria-pressed="true">Idle</button>
        <button data-mode="USER_LISTENING" aria-pressed="false">Listening</button>
        <button data-mode="PROCESSING" aria-pressed="false">Thinking</button>
        <button data-mode="WORKING" aria-pressed="false">Executing</button>
        <button data-mode="NOX_SPEAKING" aria-pressed="false">Speaking</button>
        <button data-mode="SUCCESS" aria-pressed="false">Success</button>
        <button data-mode="ERROR" aria-pressed="false">Error</button>
        <button data-mode="PAUSED" aria-pressed="false">Paused</button>
      </nav>
      <section id="core" aria-label="Holographic core test surface"><div id="root"></div></section>
    </main>
    <script type="module" src="/src/core-smoke.jsx"></script>
  </body>
</html>
