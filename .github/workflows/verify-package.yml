name: Verify and package NOX AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Package project source
        run: |
          zip -r nox-ai-hologram.zip . \
            -x '.git/*' 'frontend/node_modules/*' 'frontend/dist/*' \
               '**/__pycache__/*' '**/*.pyc' '.env' '**/.env'
      - uses: actions/upload-artifact@v4
        with:
          name: nox-ai-hologram-project
          path: nox-ai-hologram.zip
          retention-days: 7
