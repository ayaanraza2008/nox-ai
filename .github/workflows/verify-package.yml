name: Verify and package NOX AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend desktop-companion
      - name: Test defensive security tools
        run: python -m unittest discover -s desktop-companion/tests -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android companion
        run: gradle -p android-companion assembleDebug
      - name: Package project source
        run: |
          zip -r nox-ai-hologram.zip . \
            -x '.git/*' 'frontend/node_modules/*' 'frontend/dist/*' \
               '**/__pycache__/*' '**/*.pyc' 'android-companion/**/build/*' '.env' '**/.env'
      - uses: actions/upload-artifact@v4
        with:
          name: nox-ai-hologram-project
          path: nox-ai-hologram.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nox-android-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
