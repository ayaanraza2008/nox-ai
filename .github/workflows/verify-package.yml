name: Verify and package NOX AI

on:
  push:
    branches: [main, "nox/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend desktop-companion
      - name: Test backend storage regressions
        run: python -m unittest discover -s backend/tests -v
      - name: Test defensive security tools
        run: python -m unittest discover -s desktop-companion/tests -v
      - name: Validate deployed frontend
        run: test -s frontend/dist/index.html
      - name: Validate inline frontend JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      content = "".join(self.current).strip()
                      if content:
                          self.scripts.append(content)
                      self.in_script = False
          parser = ScriptExtractor()
          parser.feed(Path("frontend/dist/index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/nox-inline.js").write_text("\n;\n".join(parser.scripts), encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline script block(s)")
          PY
          node --check /tmp/nox-inline.js
      - name: Validate 3D lab JavaScript syntax
        run: node --check frontend/dist/nox-3d-lab.js
      - name: Validate agent swarm JavaScript syntax
        run: node --check frontend/dist/nox-agent-swarm.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android companion
        run: gradle -p android-companion assembleDebug
      - name: Package project source
        run: |
          zip -r nox-ai-hologram.zip . \
            -x '.git/*' 'frontend/node_modules/*' \
               '**/__pycache__/*' '**/*.pyc' 'android-companion/**/build/*' '.env' '**/.env'
      - uses: actions/upload-artifact@v4
        with:
          name: nox-ai-hologram-project
          path: nox-ai-hologram.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nox-android-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
