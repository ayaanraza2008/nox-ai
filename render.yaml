services:
  - type: web
    name: nox-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GODS_EYE_VIEW_URL
        value: https://nox-gods-eye-view.onrender.com
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: GEMINI_VISION_MODEL
        sync: false
      - key: GROQ_VISION_MODEL
        sync: false

  - type: web
    name: nox-gods-eye-view
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/gods-eye-view.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: GEV_ALLOWED_HOSTS
        value: nox-gods-eye-view.onrender.com
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "1"
