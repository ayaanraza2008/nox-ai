services:
  - type: web
    name: nox-ai
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/nox-ai.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NOX_PUBLIC_BASE_URL
        value: https://nox-ai-vcqx.onrender.com
      - key: NOX_MAP_STYLE_URL
        sync: false
      - key: NOX_LOCATION_RETENTION_DAYS
        value: "7"
      - key: NOX_EMBEDDING_API_KEY
        sync: false
      - key: NOX_EMBEDDING_MODEL
        sync: false
      - key: NOX_EMBEDDING_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: GEMINI_VISION_MODEL
        sync: false
      - key: GROQ_VISION_MODEL
        sync: false
